[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "citely"
version = "0.1.0"
description = "Citation-grounded literature review over arXiv with hybrid retrieval and pluggable model providers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Citely" }]

dependencies = [
    # config + logging
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "structlog>=24.1",
    # providers (clients lazy-imported; listed so a full env is reproducible)
    "httpx>=0.27",
    "openai>=1.30",
    "anthropic>=0.34",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "tenacity>=8.2",
    # db
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
    # ingest
    "feedparser>=6.0",
    "tiktoken>=0.7",
    # retrieval
    "rank-bm25>=0.2.2",
    # api
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "types-PyYAML>=6.0",
]

[project.scripts]
citely-ingest = "citely.ingest.__main__:main"
citely-eval = "citely.eval.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["citely"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = []

[[tool.mypy.overrides]]
module = ["citely.*.__main__", "scripts.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
